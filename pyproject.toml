[project]
name = "kaprag"
version = "0.1.0"
description = "Turkish RAG assistant over Turkish bank annual reports, with a measured ablation table."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.9.0",
    "claude-agent-sdk>=0.2.183",
    "httpx>=0.28.1",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.3",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
# Review app (scripts/review_app.py); not a default group, so `uv sync` (and CI)
# skips it. Install locally with `uv sync --group ml --group app`.
app = [
    "streamlit>=1.67",
]
dev = [
    # Runtime hook for hatchling's exact editable install (see tool.hatch below).
    "editables>=0.5",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Heavy ML stack; not a default group, so `uv sync` (and CI) skips it.
# Install locally with `uv sync --group ml`.
ml = [
    "torch>=2.9",
    "sentence-transformers>=5.0",
    "docling>=2.50",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaprag"]
# Python < 3.13 decodes .pth files with the locale encoding (e.g. cp1254), which
# breaks a plain path-based editable install when the repo path is non-ASCII.
# Exact mode stores the path in a UTF-8 .py module instead.
dev-mode-exact = true

[tool.uv]
default-groups = ["dev"]

# CUDA 13.0 wheels: the newest PyTorch CUDA flavour the local driver
# (591.74, CUDA 13.1) supports. macOS has no CUDA builds and falls back to PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "gpu: requires a CUDA GPU and the ml dependency group",
    "db: requires the docker compose Postgres (pgvector) service",
    "llm: calls a real LLM backend",
]
