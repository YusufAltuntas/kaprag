name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag past v7; pin the v10 release by SHA.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Default groups only (dev); the heavy `ml` group is not installed in CI.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -m "not gpu and not db and not llm"
